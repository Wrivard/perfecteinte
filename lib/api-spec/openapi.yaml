openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contact
    description: Quote request operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /contact:
    post:
      operationId: submitQuoteRequest
      tags: [contact]
      summary: Submit a quote request
      description: Sends the quote request to Perfecteinte and confirms receipt to the customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequestInput"
      responses:
        "200":
          description: Quote request received and emails sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequestAccepted"
        "400":
          description: Invalid quote request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequestError"
        "502":
          description: Email delivery failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequestError"
        "503":
          description: Email delivery is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequestError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    QuoteRequestInput:
      type: object
      required:
        - services
        - vehicleMake
        - vehicleModel
        - vehicleYear
        - firstName
        - lastName
        - phone
        - email
      properties:
        services:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [ppf, teintage]
        vehicleMake:
          type: string
          minLength: 1
          maxLength: 100
        vehicleModel:
          type: string
          minLength: 1
          maxLength: 100
        vehicleYear:
          type: string
          pattern: "^\\d{4}$"
        vehicleColor:
          type: string
          maxLength: 100
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          minLength: 10
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 254
        message:
          type: string
          maxLength: 3000
    QuoteRequestAccepted:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string
    QuoteRequestError:
      type: object
      required: [error]
      properties:
        error:
          type: string

